# 手元と CI で同じ clippy が動くように版を固定する。
#
# 固定しないと、新しい lint が stable に入るたびに CI だけが赤くなる。実際
# 一度そうなった（手元 1.87.0 が見逃す `sort_by_key` を CI の新しい clippy が
# 指摘した）。版を上げるのは意図的な操作にする。
#
# NOTE: この開発機では環境変数 `RUSTUP_TOOLCHAIN` が設定されており、**その
# 場合このファイルは無視される**。手元と CI を一致させたいなら、環境変数の
# ほうを外すか、ここと同じ版に合わせること。
[toolchain]
channel = "1.87.0"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
