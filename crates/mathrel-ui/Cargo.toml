[package]
name = "mathrel-ui"
description = "Leptos frontend for the Relational Math Kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

# NOTE: このクレートは意図的にワークスペースから外してある（ルートの
# Cargo.toml の `exclude`）。Leptos が rustc 1.88 を要求する一方、開発機は
# 環境変数 RUSTUP_TOOLCHAIN で 1.87 に固定されているため。members に入れると
# `cargo test --workspace` まで巻き添えで通らなくなる。
#
# ビルドは `scripts/build-web.sh`（RUSTUP_TOOLCHAIN=1.88.0 を設定して呼ぶ）。
[dependencies]
mathrel-host = { path = "../mathrel-host" }
mathrel-kernel = { path = "../mathrel-kernel" }
mathrel-verify = { path = "../mathrel-verify" }

leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["Element", "HtmlElement", "Event", "EventTarget", "Document", "Window"]

[lints.rust]
missing_docs = "warn"

[profile.release]
opt-level = "s"
lto = true
