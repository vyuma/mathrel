[workspace]
resolver = "2"
members = [
    "crates/mathrel-kernel",
    "crates/mathrel-verify",
    "crates/mathrel-host",
    "crates/mathrel-cli",
    "crates/mathrel-wasm",
]
# UI は別ビルドにする。Leptos が rustc 1.88 を要求するのに対し、この開発機は
# 環境変数 RUSTUP_TOOLCHAIN で 1.87 に固定されているためである。members に
# 入れると `cargo test --workspace` まで巻き添えで通らなくなる。
# ビルドは scripts/build-web.sh が行う。
exclude = ["crates/mathrel-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mathrel-kernel = { path = "crates/mathrel-kernel" }
mathrel-verify = { path = "crates/mathrel-verify" }
mathrel-host = { path = "crates/mathrel-host" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
