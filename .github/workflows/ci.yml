name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 版は rust-toolchain.toml が決める。ここで stable を入れてはならない。
      # 手元と CI で clippy の版がずれると、CI だけが赤くなる。
      - name: Rust ツールチェイン
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: clippy
        run: cargo clippy --workspace --all-targets

      # 性質テストは実行のたびに新しい乱数で 1000 ケース回る。ここで回すこと
      # 自体に価値がある。実際、手元の 6 回の実行で 1 度だけ出た反例から
      # カーネルのバグが 1 件見つかっている。
      # 過去の反例は properties.proptest-regressions に入っており、
      # 新しいケースより先に必ず再実行される。
      - name: test
        run: cargo test --workspace

      # ABI はネイティブでテストしているが、本番の的は wasm である。
      # ここが通らなければ UI が動かない。
      - name: wasm ビルド
        run: cargo build -p mathrel-wasm --target wasm32-unknown-unknown --release

      - name: wasm の export を確認
        run: |
          node -e '
            const fs = require("fs");
            const wasm = "target/wasm32-unknown-unknown/release/mathrel_wasm.wasm";
            WebAssembly.compile(fs.readFileSync(wasm)).then((module) => {
              const found = new Set(
                WebAssembly.Module.exports(module).map((e) => e.name),
              );
              const required = [
                "memory", "mr_alloc", "mr_free", "mr_result_ptr", "mr_result_len",
                "mr_workspace_new", "mr_workspace_free", "mr_add_cell",
                "mr_update_cell", "mr_remove_cell", "mr_evaluate", "mr_snapshot",
              ];
              const missing = required.filter((name) => !found.has(name));
              if (missing.length) {
                console.error("export が足りません:", missing.join(", "));
                process.exit(1);
              }
              console.log("export はすべて揃っています (" + required.length + " 件)");
            });
          '

      - name: fmt
        run: cargo fmt --all --check

  # UI はワークスペースから外してある（Leptos が rustc 1.88 を要求する一方、
  # 開発機は環境変数で 1.87 に固定されているため）。別ジョブで建てる。
  ui:
    name: UI (Leptos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/mathrel-ui
    steps:
      - uses: actions/checkout@v5

      - name: Rust ツールチェイン
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
          rustup default 1.88.0
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mathrel-ui

      # 画面の判断（何を見せるか）はブラウザなしでテストできる。
      - name: test
        run: cargo test

      - name: clippy
        run: cargo clippy --all-targets

      - name: fmt
        run: cargo fmt --check

      - name: trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin

      - name: build
        run: trunk build --release
